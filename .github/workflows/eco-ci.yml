name: Eco-CI Tests for Min Browser
run-name: Eco-CI on Min - feature/eco-ci Branch

on:
  push:
    branches:
      - feature/eco-ci
  pull_request:
    branches:
      - feature/eco-ci

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Start Measurement
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: start-measurement

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'feature/eco-ci'

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    # - name: Create package-lock.json if missing
    #   run: |
    #     if [ ! -f package-lock.json ]; then
    #       npm install --package-lock-only
    #     fi

    - name: Get Measurement - Dependency Install
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'dependency install'
      continue-on-error: true

    - name: Install dependencies
      run: npm install

    - name: Run UI Tests
      run: npm test
      continue-on-error: true
    
    - name: Show test output
      run: cat test-results.txt || echo "No test output file found."
      continue-on-error: true

    - name: Get Measurement - Test Run
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: get-measurement
        label: 'npm test'
      continue-on-error: true

    - name: Display Energy Results
      uses: green-coding-solutions/eco-ci-energy-estimation@v4
      with:
        task: display-results
      continue-on-error: true

    # - name: Upload Eco-CI Report
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: eco-ci-report
    #     path: eco-ci-report.json
